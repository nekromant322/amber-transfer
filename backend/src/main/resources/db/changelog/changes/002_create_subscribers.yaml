databaseChangeLog:
  - changeSet:
      id: 002_create_subscribers
      author: transfer
      changes:
        - createTable:
            tableName: subscribers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: subscribed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false