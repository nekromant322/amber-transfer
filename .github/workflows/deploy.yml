name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  push_compose:
    name: Push docker-compose.yml to remote server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@master
        with:
          host: "194.87.96.29"
          username: "github-transfer"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/github-transfer"

  build_and_push_images:
    name: Push images to DockerHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push transfer-backend
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/nekromant322/transfer-backend:latest

      - name: Build and push transfer-frontend
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/nekromant322/transfer-frontend:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ build_and_push_images, push_compose ]
    steps:
      - name: Connect with SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: "194.87.96.29"
          username: "github-transfer"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo TRANSFER_DB_USER=${{ secrets.TRANSFER_DB_USER }} >> transfer-env.txt
            echo TRANSFER_DB_PASSWORD=${{ secrets.TRANSFER_DB_PASSWORD }} >> transfer-env.txt

            sudo -S docker stop transfer-backend || true
            sudo -S docker stop transfer-frontend || true
            sudo -S docker rm transfer-backend || true
            sudo -S docker rm transfer-frontend || true
            sudo -S docker rmi nekromant322/transfer-backend || true
            sudo -S docker rmi nekromant322/transfer-frontend || true
            sudo -S docker compose -f docker-compose.yml --env-file=transfer-env.txt up -d
            sudo -S docker ps -a

#            rm transfer-env.txt
